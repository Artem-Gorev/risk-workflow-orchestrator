name: codestyle

on:
  push:
    branches: [main, develop, master]
  pull_request:
    branches: [main, develop, master]

jobs:
  flake8:
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install flake8
        run: python -m pip install flake8==7.3.0
      - name: Run flake8
        run: python -m flake8 backend scripts tests --config=setup.cfg --show-source --statistics
