name: Main tests
on:
  push:
    branches: [main, develop, master]
  pull_request:
    branches: [main, develop, master]
jobs:
  all_functionality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: risk_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 3s --health-timeout 3s --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:ci@localhost/risk_test
    steps:
      - name: Code checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Run main tests
        run: python -m pytest tests/ -q
  browser:
    runs-on: ubuntu-24.04
    env:
      POSTGRES_PASSWORD: riskflow-browser-ci
    steps:
      - name: Code checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - run: sh scripts/start-local.sh
      - run: python scripts/browser_check.py
      - if: failure()
        run: docker compose logs --tail 150 backend
      - if: always()
        run: docker compose down -v
