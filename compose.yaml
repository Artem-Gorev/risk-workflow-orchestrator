services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: risk
      POSTGRES_USER: risk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?configure .env}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "risk", "-d", "risk"]
      interval: 3s
      timeout: 2s
      retries: 20
  backend:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://risk:${POSTGRES_PASSWORD}@db/risk
      BACKEND_LOCK_PATH: /run/risk/backend.lock
      SYNTHETIC_START_DATE: ${SYNTHETIC_START_DATE:-2026-11-23}
      SYNTHETIC_END_DATE: ${SYNTHETIC_END_DATE:-2026-11-30}
      WORKER_SLOTS: ${WORKER_SLOTS:-2}
      WORKER_DELAY_SECONDS: ${WORKER_DELAY_SECONDS:-0}
      DAILY_ENABLED: ${DAILY_ENABLED:-0}
      AUTH_MODE: ${AUTH_MODE:-local}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      DISPATCH_POLL_SECONDS: ${DISPATCH_POLL_SECONDS:-1}
      SCHEDULER_POLL_SECONDS: ${SCHEDULER_POLL_SECONDS:-1}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - runtime:/run/risk
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 10
volumes:
  database:
  runtime:
